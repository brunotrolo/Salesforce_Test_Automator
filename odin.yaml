# Contrato da skill no Odin (schemas/odin.schema.json). Mantido neste repositório; o catálogo só lê.
id: sf-test
nome: Test Automator
dominio: salesforce
dono: mantenedor
descricao: QA de tela autônomo na sandbox. Lê o backlog, a spec e o relatório de construção, executa os casos no navegador e separa bug, comportamento previsto e ponto a confirmar.
intencoes:
  - testar a capacidade na sandbox
  - rodar o QA de tela da entrega
  - validar a jornada no navegador antes de homologar
  - executar os casos de teste da história
  - testar a tela de ponta a ponta com Playwright
  - verificar se a entrega atende os critérios de aceite
  - fazer o teste funcional da jornada de proposta
  - texto: criar a classe de teste Apex
    negativa: true
  - texto: aumentar a cobertura de código
    negativa: true
perfis_sugeridos:
  - qa
  - dev
proximo:
  - sf-deep-debugger
skills:
  - path: .claude/skills/sf-test/SKILL.md
  - path: .claude/skills/sf-test-status/SKILL.md
agentes:
  - .claude/agents/sf-qa-case-quality-review.md
  - .claude/agents/sf-qa-coverage-review.md
  - .claude/agents/sf-qa-executor.md
  - .claude/agents/sf-qa-judge.md
regras:
  - .claude/rules/qa-governance.md
  - .claude/rules/sandbox-only.md
avaliacoes: evals/
runtime:
  dir: .claude/skills/sf-test/scripts
  node: ">=20"
  prerequisitos:
    - node
    - git
